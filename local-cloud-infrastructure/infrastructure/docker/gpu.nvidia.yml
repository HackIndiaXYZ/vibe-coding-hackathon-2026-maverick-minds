# NVIDIA GPU overlay for Ollama.
# Enable: COMPOSE_FILE=docker-compose.yml:docker/gpu.nvidia.yml
# Requires NVIDIA Container Toolkit on the host.

services:
  ollama:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
