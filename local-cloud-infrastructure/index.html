<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!--
      Content Security Policy:
      - default-src 'self'           → no external resource loading
      - script-src 'self'            → no inline scripts, no eval
      - style-src 'self' 'unsafe-inline' → allow inline styles for CSS-in-JS
      - img-src 'self' data: blob:   → local images + camera blobs
      - media-src 'self' blob:       → video stream blobs
      - connect-src 'self'           → no external fetch/XHR
      - font-src 'self' data:        → allow font loading
    -->
        <meta
            http-equiv="Content-Security-Policy"
            content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        img-src 'self' data: blob:;
        media-src 'self' blob:;
        connect-src 'self' ws://localhost:5173;
        font-src 'self' data: https://fonts.gstatic.com;
      "
        />

        <link rel="icon" type="image/png" href="/favicon.png" />
        <title>Local Cloud Infrastructure</title>
        <meta
            name="description"
            content="Secure local cloud management — storage, surveillance, and encrypted backups."
        />

        <!-- Preconnect to Google Fonts for Space Grotesk and Syne -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
